[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "met-timeseries"
version = "0.1.0"
description = "Meteorological timeseries downloading and processing for hydrologic models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cfgrib>=0.9",
    "click>=8.0",
    "earthaccess>=0.9",
    "geopandas>=0.14",
    "h5netcdf>=1.0",
    "metpy>=1.5",
    "mettoolbox>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "requests>=2.28",
    "shapely>=2.0",
    "xarray>=2023.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
met-timeseries = "met_timeseries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
