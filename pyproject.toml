[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "met-timeseries"
version = "0.1.0"
description = "Pipeline for extracting hourly meteorological timeseries from gridded data products and aggregating to polygon areas of interest"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "met-timeseries contributors" }]
keywords = ["meteorology", "timeseries", "NLDAS", "PRISM", "hydrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "pynldas2>=0.2",
    "xarray>=2024.1",
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.12",
    "geopandas>=1.0",
    "rioxarray>=0.15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "exactextract>=0.2",
    "netcdf4>=1.6",
    "pyarrow>=14.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
perf = ["numba>=0.60", "dask[complete]>=2024.1", "bottleneck>=1.3"]
ensemble = [
    "pygridmet>=0.2",
    "pydaymet>=0.4",
    "zarr>=2.16",
    "gcsfs>=2024.1",
    "s3fs>=2024.1",
]
viz = ["matplotlib>=3.8", "hvplot>=0.9", "folium>=0.15"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.5",
    "nox>=2023.4",
]
docs = ["sphinx>=7.2", "sphinx-rtd-theme>=2.0", "nbsphinx>=0.9"]

[project.scripts]
met-timeseries = "met_timeseries.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/met_timeseries"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["met_timeseries"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
